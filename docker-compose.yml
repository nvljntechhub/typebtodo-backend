services:
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_DB: todobackend-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: change-me
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d todobackend-db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
